trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: epicbook-secrets
  - name: azureServiceConnection
    value: 'azure-epicbook-connection'
  - name: tfDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform'

stages:
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: Validate
        steps:
          - task: HashiCorpTerraform@1
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(tfDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-epicbook-tfstate'
              backendAzureRmStorageAccountName: '<STORAGE_ACCOUNT_NAME>'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'epicbook.terraform.tfstate'
          - task: HashiCorpTerraform@1
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(tfDirectory)'

  - stage: Plan
    displayName: 'Plan Infrastructure'
    dependsOn: Validate
    jobs:
      - job: Plan
        steps:
          - task: HashiCorpTerraform@1
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(tfDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-epicbook-tfstate'
              backendAzureRmStorageAccountName: '<STORAGE_ACCOUNT_NAME>'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'epicbook.terraform.tfstate'
          - task: HashiCorpTerraform@1
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(tfDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-out=$(System.DefaultWorkingDirectory)/tfplan -var="ssh_public_key=$(SSH_PUBLIC_KEY)" -var="admin_ip_address=$(ADMIN_IP)" -var="mysql_admin_password=$(MYSQL_ADMIN_PASSWORD)"'
          - task: PublishPipelineArtifact@1
            displayName: 'Publish TF Plan'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/tfplan'
              artifact: 'tfplan'

  - stage: Apply
    displayName: 'Apply Infrastructure'
    dependsOn: Plan
    jobs:
      - deployment: Apply
        environment: 'EpicBook-Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'tfplan'
                    path: '$(System.DefaultWorkingDirectory)'
                - task: HashiCorpTerraform@1
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(tfDirectory)'
                    backendServiceArm: '$(azureServiceConnection)'
                    backendAzureRmResourceGroupName: 'rg-epicbook-tfstate'
                    backendAzureRmStorageAccountName: '<STORAGE_ACCOUNT_NAME>'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'epicbook.terraform.tfstate'
                - task: HashiCorpTerraform@1
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(tfDirectory)'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    commandOptions: '$(System.DefaultWorkingDirectory)/tfplan'
                - task: AzureCLI@2
                  displayName: 'Output Infrastructure Details'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      cd $(tfDirectory)
                      echo "=========================================="
                      echo "  TERRAFORM OUTPUTS FOR HANDOFF"
                      echo "=========================================="
                      terraform output -no-color